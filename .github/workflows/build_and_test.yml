name: CI

on:
  # Run action on certain pull request events
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  # Nightly job on default (main) branch
  schedule:
    - cron: "0 0 * * *"

  # Whenever certain branches are pushed
  push:
    branches: [main]

  # On demand from github.com for testing
  workflow_dispatch:

# Ensures that only one workflow runs at a time for this branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    uses: ./.github/workflows/format.yml

  build_pypi_wheels:
    uses: ./.github/workflows/build-pypi-wheels.yml

  ubuntu_build_and_test:
    uses: ./.github/workflows/ubuntu_build_and_test.yml

  ros_build_and_test:
    uses: ./.github/workflows/ros_build_and_test.yml

  pixi_build_and_test:
    uses: ./.github/workflows/pixi_build_and_test.yml

  rrt_benchmarks:
    uses: ./.github/workflows/rrt_benchmarks.yml
